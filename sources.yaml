# ─── Trading Alpha Engine — ingestion targets ──────────────────────────────────
# Edit this file to retarget the engine. No code changes required.
# All feeds/repos below were verified reachable. Add your own freely.

github:
  # What to pull from each repo: any of [commits, releases]
  # Curated to a few FLAGSHIP, mainstream-popular trading projects (the source itself is the
  # topic filter here — every commit/release is on-brand). Add more freely.
  # RELEASES ONLY: individual commits are too granular to be "insights" — one active repo can
  # produce dozens of near-identical bugfix cards and swamp the feed. A release is the unit a
  # trader actually cares about. Add `commits` back if you want commit-level signal.
  track: [releases]
  repos:
    - freqtrade/freqtrade                 # most-popular open-source trading bot
    - QuantConnect/Lean                   # mainstream algo/backtesting engine
    - OpenBB-finance/OpenBB               # popular open research/data platform
    - polakowo/vectorbt                   # widely-used backtesting/research library
    - nautechsystems/nautilus_trader      # production-grade live trading platform

reddit:
  # Credential-free: pulled via Reddit's public subreddit RSS (no OAuth/app needed).
  # COMMUNITY-stream source (discussion), held to a lower relevance bar. Kept to the most
  # active, mainstream algo/markets communities + the two biggest India trading subs.
  subreddits:
    - algotrading
    - quant
    - options              # where "how do I automate this?" questions concentrate
    - IndianStreetBets
    - IndianStockMarket
  listing: top          # top | hot | new
  time_filter: week     # for "top": hour | day | week | month | year | all
  min_score: 0          # (only applies to the optional PRAW path; RSS has no score)

rss:
  # MAINSTREAM-LED backbone. Broad news feeds carry an ingest `screen:` so only on-topic
  # items reach the LLM: `screen: ai` (financial media → keep AI/automation-in-trading items)
  # or `screen: markets` (tech media → keep trading/finance items). Screen keyword groups are
  # defined at the bottom of this block; flagship platform feeds run unscreened (already on-topic).
  feeds:
    # MEASURED YIELD DRIVES THIS LIST. Every feed below has earned its place; anything that
    # ingests items but never produces a kept insight is removed (same method as the Moneycontrol
    # note further down). Measure with: items ingested per feed vs insights still live.
    #
    # Aug 2026 measurement over the full corpus (2,900 raw items) removed 9 mainstream-media feeds
    # that had produced ZERO insights between them across 471 ingested items — YourStory (162),
    # Entrackr (125), Economic Times Markets (61), Inc42 Fintech (56), TechCrunch Fintech (20),
    # "Hacker News: quant" (20), ET Markets Stocks (12), Economic Times Startups (11),
    # VentureBeat AI (11), Product Hunt (5). They publish general startup/business news, which the
    # rubric correctly scores as noise, so they only ever cost LLM calls. Don't re-add general
    # tech/startup media here: the brief is about trading, and a fintech funding round is not a
    # trading insight unless it is a capital-markets venture.
    #
    # The same measurement RESTORED the specialist quant blogs below, which a6947bc had dropped in
    # favour of that mainstream set. They are the highest-yield sources in the corpus by a wide
    # margin (Quantitativo 55%, The Quant's Playbook 52%, Hudson & Thames 40%, Dean Markwick 30%,
    # IBKR Quant 25%, Jane Street Tech Blog 20%) — a practitioner writing up a method is exactly
    # what this brief is for.
    #
    # ── Mainstream financial media (screen: ai) — mostly India-tagged by the LLM ──
    - name: "Livemint Markets"
      url: "https://www.livemint.com/rss/markets"
      screen: ai
    - name: "CNBC Investing"
      url: "https://search.cnbc.com/rss/2.0/id/15839135/device/rss/rss.html"
      screen: ai
    # ── Specialist quant / trading practitioner blogs (no screen — already on-topic) ──
    - name: "Quantitativo"
      url: "https://quantitativo.substack.com/feed"
    - name: "The Quant's Playbook"
      url: "https://www.quant-galore.com/feed"
    - name: "Hudson & Thames"
      url: "https://hudsonthames.org/feed/"
    - name: "Dean Markwick"
      url: "https://dm13450.github.io/feed.xml"
    - name: "IBKR Quant"
      url: "https://www.interactivebrokers.com/campus/category/ibkr-quant-news/feed/"
    - name: "Jane Street Tech Blog"
      url: "https://blog.janestreet.com/feed.xml"
    - name: "Robot Wealth"
      url: "https://robotwealth.com/feed/"
    - name: "Databento"
      url: "https://databento.com/blog/rss.xml"
    # ── Flagship platforms / high-signal (no screen — already on-topic) ──
    - name: "Zerodha Z-Connect"
      url: "https://zerodha.com/z-connect/feed"
    - name: "QuantInsti"
      url: "https://blog.quantinsti.com/feed/"
    - name: "Alpaca Markets"
      url: "https://alpaca.markets/blog/feed"
    # Query-filtered at the source by topic — high signal, no screen needed.
    # "Hacker News: quant" (q=quant finance) removed — 20 items, 0 kept. The algorithmic-trading
    # query below is the one that lands; the quant-finance query returns academic/careers chatter.
    - name: "Hacker News: algorithmic trading"
      url: "https://hnrss.org/newest?q=algorithmic%20trading"
    # ── Capital-markets & trading trade press — launches + funding (screen: markets) ──
    # (The TRADE / thetradenews.com omitted — its /feed/ returns no parseable entries. Finextra
    # Markets + Crunchbase News verified live. Add more capital-markets feeds the same way.)
    - name: "Finextra Markets"
      url: "https://www.finextra.com/rss/channel.aspx?channel=markets"
      screen: markets
    - name: "Finextra Headlines"
      url: "https://www.finextra.com/rss/headlines.aspx"
      screen: markets
    - name: "Crunchbase News"
      url: "https://news.crunchbase.com/feed/"
      screen: markets
    # NOTE: the Indian startup/fintech ecosystem feeds (Entrackr, YourStory, Economic Times
    # Startups, Inc42) were REMOVED after measurement — 354 items ingested, 0 kept, ever. They
    # cover general startup funding (D2C, logistics, lending), not capital markets, so CAPITAL
    # MARKETS FOCUS in the prompt de-scores them to 1-4 by design. The /launches tab is fed by
    # capital-markets venture news (Finextra, Crunchbase) instead. Don't re-add without a screen
    # that admits only exchange/broker/trading-infra ventures.
    # NOTE: Moneycontrol Markets and ET Markets Stocks were trialled here to feed the India tab
    # and the Nifty/Bank Nifty axis, and REMOVED after measurement: 16 items ingested, 16 scored,
    # 0 kept. They publish daily price commentary ("Sensex, Nifty gain for third day", "Q1 Results
    # today") — precisely what the rubric scores as noise. They cost ~16 LLM calls per run for
    # nothing. The index axis is populated by index-focused STRATEGY content (Zerodha, the India
    # subs, broker/tooling posts), not by market-wrap feeds. Don't re-add without a screen that
    # admits only method/strategy pieces.
    # NOTE: Product Hunt was trialled for new-product discovery and REMOVED after measurement —
    # 5 items, 0 kept. Even screened, its feed is overwhelmingly consumer apps.

  # Ingest screen keyword groups. Matched case-insensitively as whole WORDS (word boundaries),
  # so short tokens like "ai"/"nse" don't match inside "retail"/"sense". Include plural forms
  # ("stock" won't match "stocks"). Edit freely; an empty group disables that screen mode.
  screen_keywords_ai:
    - ai
    - artificial intelligence
    - machine learning
    - ml
    - deep learning
    - neural
    - llm
    - llms
    - gpt
    - generative
    - algorithm
    - algorithms
    - algorithmic
    - algo
    - algos
    - automation
    - automated
    - bot
    - bots
    - agent
    - agents
    - agentic
    - copilot
    - quant
    - quantitative
    - predictive
    - data-driven
  screen_keywords_markets:
    - trading
    - trade
    - trades
    - trader
    - traders
    - market
    - markets
    - stock
    - stocks
    - equity
    - equities
    - share
    - shares
    - option
    - options
    - futures
    - forex
    - fx
    - portfolio
    - portfolios
    - broker
    - brokers
    - brokerage
    - exchange
    - exchanges
    - investing
    - investment
    - investments
    - investor
    - investors
    - derivative
    - derivatives
    - etf
    - etfs
    - alpha
    - backtest
    - hedge fund
    - crypto
    - nifty
    - sensex
    - nse
    - bse
    - sebi
    - zerodha
    - upstox
    # Venture/funding vocabulary — so genuine startup & funding headlines survive ingest and
    # reach the LLM (which then de-scores any non-trading consumer fintech). Feeds the Launches tab.
    - funding
    - funded
    - raise
    - raises
    - raised
    - seed
    - series
    - round
    - venture
    - ventures
    - startup
    - startups
    - acquire
    - acquires
    - acquired
    - acquisition
    - merger
    - ipo
    - valuation

forums:
  # COMMUNITY-stream source. QuantConnect has a dedicated scraper (newest threads via
  # last-page discovery); any other forum here uses a generic RSS-then-HTML fallback.
  # A source that fails to parse is skipped, not fatal.
  # NOTE: Freqtrade was removed — its GitHub Discussions are disabled and its community is
  # Discord-gated (no free API). Freqtrade/crypto discussion is covered via r/algotrading,
  # and its engineering via the freqtrade release feed + GitHub commits.
  - name: "QuantConnect Community"
    type: html
    url: "https://www.quantconnect.com/forum/discussions"

mcp:
  # DISABLED (resource reduction): the 10-query GitHub-search discovery firehose was mostly
  # noise. Leave github_search_queries empty and build_sources skips the adapter. Re-add
  # queries here to turn MCP-server discovery back on.
  github_search_queries: []

bluesky:
  # DISABLED (resource reduction): low signal-to-noise community firehose. Set enabled: true
  # (and re-add queries) to turn back on.
  enabled: false
  queries:
    - "algorithmic trading"

numerai:
  # DISABLED (resource reduction): niche tournament source. Set enabled: true to turn back on.
  enabled: false
  forum_url: "https://forum.numer.ai"
  api_url: "https://api-tournament.numer.ai"
  leaderboard_size: 5

stocktwits:
  # Optional Firestream integration. Enable only with provisioned environment credentials.
  enabled: false
  symbols: [SPY, QQQ, NVDA, BTC]
  max_messages: 25
  poll_seconds: 10

twitter:
  # Stubbed. Adapter stays disabled unless TWITTER_ENABLED=true AND a bearer token is set.
  enabled: false
  handles:
    # - some_builder
    # - another_quant_dev

careers:
  # ALPHA-stream source. Public applicant-tracking-system job boards for top quant / HFT firms —
  # what they're building and hiring for. Each posting is scored by the LLM under the
  # "Quant Firms" category (routine listings are filtered; team build-outs / tech-stack signals
  # survive). `ats` is one of greenhouse | lever | ashby; `token` is the firm's public board slug.
  # Tokens below were verified live (2026-07); add lever/ashby firms the same way.
  # Mainstream quant/HFT firms (global) + India quant/HFT firms. `token` is the firm's public
  # ATS board slug. India firms feed the /jobs + /india tabs; the LLM region-tags by job location.
  # Graviton & AlphaGrep are Greenhouse-confirmed; the other India firms are best-effort — verify
  # each with `ingest-only -s careers` and drop any that 404 or use a non-ATS careers page.
  enabled: true
  firms:
    # Global
    - { firm: "Jane Street", ats: greenhouse, token: janestreet }
    - { firm: "Jump Trading", ats: greenhouse, token: jumptrading }
    - { firm: "DRW", ats: greenhouse, token: drweng }
    - { firm: "IMC Trading", ats: greenhouse, token: imc }
    - { firm: "Tower Research Capital", ats: greenhouse, token: towerresearchcapital }
    - { firm: "Point72 / Cubist", ats: greenhouse, token: point72 }
    # India-heavy (verified live on Greenhouse — Graviton lists Gurugram/Gandhinagar roles,
    # WorldQuant has Bengaluru/Mumbai offices; the LLM region-tags by each posting's location).
    - { firm: "Graviton Research Capital", ats: greenhouse, token: gravitonresearchcapital }
    - { firm: "AlphaGrep Securities", ats: greenhouse, token: alphagrepsecurities }
    - { firm: "WorldQuant", ats: greenhouse, token: worldquant }
    - { firm: "NK Securities Research", ats: greenhouse, token: nksecuritiesresearch }
    # Quadeye has no Greenhouse board — its careers site embeds Zoho Recruit, whose public
    # Job_Openings API we read directly. `token` is the zohorecruit.in subdomain.
    - { firm: "Quadeye", ats: zoho, token: quadeye }
    # NOTE: Dolat Capital lists no open roles, and Estee Advisors has no ATS (static HTML, email
    # apply) — a scrape would yield titles with no description for the LLM to score. Neither added.
    # LinkedIn / AngelList are not viable sources: both require auth and disallow scraping.
